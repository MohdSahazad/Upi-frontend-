<!DOCTYPE html>
<html>
<head>
<title>Pay Direct to Bank</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font-family: Arial; background: #f2f2f2; display: flex; justify-content: center; padding-top: 30px; }
  .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 380px; text-align:center; margin: 10px; }
  .logo { font-size: 24px; font-weight: bold; color: #0F9D58; margin-bottom: 20px; }
  input, button { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
  button { background: #0F9D58; color: white; border: none; font-size: 16px; cursor: pointer; font-weight: bold; }
  button:hover { background: #0b8047; }
  #qr img { margin: 15px auto; display: block; }
  .secure { font-size: 12px; color: green; margin-top: 10px; }
  .top-btn { position: absolute; top: 15px; right: 15px; padding:8px 15px; background:red; color:white; border:none; border-radius:5px; cursor:pointer; }
  table { width:100%; border-collapse: collapse; margin-top: 15px; font-size: 12px;}
  th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
  th { background: #0F9D58; color: white; }
  .page { display: none; }
  .page.active { display: block; }
  .s-btn { padding:5px 10px; font-size:11px; width:auto; margin:2px; border-radius:4px; }
</style>
</head>
<body>

<button class="top-btn" id="topBtn" onclick="showPage('login')">Admin Login</button>

<div class="card page active" id="customerPage">
  <div class="logo">🏦 Direct UPI Payment</div>
  <input type="text" id="name" placeholder="Enter Your Name" required>
  <input type="number" id="amount" placeholder="Enter Amount ₹" value="500" required>
  <button onclick="payUPI()">1. Pay with UPI App</button>
  <button onclick="showQR()">2. Show QR Code</button>
  <div id="qr"></div>
  <button style="background:#FF6F00" onclick="confirmPayment()">3. I Have Paid</button>
  <p id="txnid" style="font-size:12px; color:gray;"></p>
  <p class="secure">🔒 Payment is manually verified for 100% security</p>
</div>

<div class="card page" id="loginPage">
  <div class="logo">🔑 Admin Login</div>
  <input type="text" id="adminUser" placeholder="Username" autocomplete="off">
  <input type="password" id="adminPass" placeholder="Password" autocomplete="off">
  <button onclick="doLogin()">Login</button>
  <p id="loginErr" style="color:red"></p>
  <button style="background:gray" onclick="showPage('customer')">Wapas Home</button>
</div>

<div class="card page" id="adminPage" style="width: 95%; max-width: 900px;">
  <div class="logo">📊 Admin Panel</div>
  <button style="background:red; width:auto; padding:8px 15px; float:right;" onclick="logout()">Logout</button>
  <button style="background:gray; width:auto; padding:8px 15px;" onclick="showPage('customer')">Customer Page</button>
  <button style="background:blue; width:auto; padding:8px 15px;" onclick="loadTxns()">Refresh</button>
  <div id="txnTable">Loading...</div>
</div>

<script src="https://cdn.rawgit.com/davidshimjs/qrcodejs/master/qrcode.min.js"></script>
<script>
let YOUR_UPI = "abhi31845@ptaxis";
let BACKEND_URL = "https://web-production-2f2524.up.railway.app";
let currentTxn = "";

function showPage(page){
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  if(page === 'customer'){
    document.getElementById('customerPage').classList.add('active');
    document.getElementById('topBtn').style.display = 'block';
  }
  if(page === 'login'){
    document.getElementById('loginPage').classList.add('active');
    document.getElementById('topBtn').style.display = 'none';
  }
  if(page === 'admin'){
    document.getElementById('adminPage').classList.add('active');
    document.getElementById('topBtn').style.display = 'none';
    loadTxns();
  }
}

async function doLogin(){
  let u = document.getElementById('adminUser').value.trim();
  let p = document.getElementById('adminPass').value.trim();
  if(!u || !p) return alert("Username/Password likho");
  
  document.getElementById('loginErr').innerText = "Checking...";
  try {
    let res = await fetch(BACKEND_URL + '/login', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({username: u, password: p}),
      credentials: 'include'
    });
    // Backend redirect deta hai ya 200
    if(res.redirected || res.ok){
      localStorage.setItem("isAdmin", "true");
      showPage('admin');
    } else {
      let txt = await res.text();
      if(txt.includes("Wrong") || res.status===401) document.getElementById('loginErr').innerText = "Galat Username ya Password";
      else { localStorage.setItem("isAdmin", "true"); showPage('admin'); }
    }
  } catch(e){
    // Agar fetch fail bhi ho jaye to local check
    if(u === "admin" && p === "admin@123"){
      localStorage.setItem("isAdmin", "true");
      showPage('admin');
    } else {
      document.getElementById('loginErr').innerText = "Backend error: " + e;
    }
  }
}

function logout(){
  fetch(BACKEND_URL + '/logout', {credentials:'include'});
  localStorage.removeItem("isAdmin");
  showPage('login');
}

function payUPI() {
  let name = document.getElementById('name').value;
  let amount = document.getElementById('amount').value;
  if(!name || !amount) return alert("Name and Amount required");
  currentTxn = "TXN" + Date.now();
  document.getElementById('txnid').innerText = "Your TXN ID: " + currentTxn;
  saveTxn(name, amount, currentTxn);
  let upiURL = `upi://pay?pa=${YOUR_UPI}&pn=MyBusiness&am=${amount}&tn=${currentTxn}&tr=${currentTxn}&cu=INR`;
  window.location.href = upiURL; 
}

function showQR() {
  let name = document.getElementById('name').value;
  let amount = document.getElementById('amount').value;
  if(!name || !amount) return alert("Name and Amount required");
  currentTxn = "TXN" + Date.now();
  document.getElementById('txnid').innerText = "Your TXN ID: " + currentTxn;
  saveTxn(name, amount, currentTxn);
  let upiURL = `upi://pay?pa=${YOUR_UPI}&pn=MyBusiness&am=${amount}&tn=${currentTxn}&tr=${currentTxn}&cu=INR`;
  document.getElementById('qr').innerHTML = "";
  new QRCode(document.getElementById("qr"), { text: upiURL, width: 220, height: 220 });
}

function saveTxn(name, amount, txnid) {
  fetch(BACKEND_URL + '/create-txn', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({name, amount, txnid})
  }).catch(err => console.log("Backend Error:", err));
}

function confirmPayment() {
  if(!currentTxn) return alert("Pehle Pay ya QR generate karo");
  alert(`TXN ID: ${currentTxn}\n\nPlease send screenshot to admin WhatsApp.\nWe will verify and confirm in 5 minutes.`);
}

function loadTxns(){
  if(localStorage.getItem("isAdmin") !== "true"){ showPage('login'); return; }
  document.getElementById('txnTable').innerText = "Loading...";
  fetch(BACKEND_URL + '/transactions')
  .then(res => res.json())
  .then(data => {
    if(data.length === 0){ document.getElementById('txnTable').innerHTML = "Koi transaction nahi hai"; return; }
    let html = `<table><tr><th>Time</th><th>Name</th><th>Amount</th><th>TXN ID</th><th>Status</th></tr>`;
    data.forEach(txn => {
      let color = txn.status === 'Success' ? 'green' : txn.status === 'Failed' ? 'red' : 'orange';
      html += `<tr>
        <td>${new Date(txn.created_at).toLocaleString()}</td>
        <td>${txn.name}</td>
        <td>₹${txn.amount}</td>
        <td>${txn.txnid}</td>
        <td>
          <b style="color:${color}">${txn.status}</b><br>
          <button class="s-btn" style="background:green" onclick="updateStatus('${txn.txnid}','Success')">Success</button>
          <button class="s-btn" style="background:red" onclick="updateStatus('${txn.txnid}','Failed')">Failed</button>
        </td>
      </tr>`;
    });
    html += `</table>`;
    document.getElementById('txnTable').innerHTML = html;
  }).catch(err => {
    document.getElementById('txnTable').innerHTML = "Backend connect nahi ho raha<br><small>" + err + "</small>";
  });
}

async function updateStatus(txnid, newStatus){
  if(!confirm(txnid + " ko " + newStatus + " karna hai?")) return;
  try {
    let res = await fetch(BACKEND_URL + '/update-status', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({txnid: txnid, status: newStatus}),
      credentials: 'include'
    });
    let data = await res.json();
    if(data.success){
      alert("Updated to " + newStatus);
      loadTxns();
    } else {
      alert("Error: " + JSON.stringify(data));
    }
  } catch(e){
    alert("Update fail: " + e);
  }
}
</script>
</body>
</html>
